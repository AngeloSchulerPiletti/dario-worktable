# tmux settings for `work`: what Claude Code needs to behave well inside tmux.
# Loaded from ~/.tmux.conf by a `source-file` line that install.sh adds.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys,xterm-256color:RGB:extkeys"
set -g extended-keys on          # Shift+Enter etc. reach Claude Code
set -g allow-passthrough on      # notifications / OSC sequences from Claude Code
set -g focus-events on
set -sg escape-time 10           # no lag on Esc (interrupting Claude)

set -g mouse on                  # scroll and click with the mouse
set -g history-limit 100000
set -g base-index 1              # windows are 1 impl, 2 review, 3 shell
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on             # terminal title = issue + window
set -g set-titles-string "#S · #W"
set -g status-left "[#S] "
set -g status-left-length 20
